addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
const ready = () => audio && !muted && audio.noise;

// ---- Music: written note by note in code, so the game still plays offline -------------------------------
// A minor, four bars (Am F C G). The title is slow and tense; a match is a driving beat that

const MUS = { step: 0, next: 0, mode: 'off', timer: null };

function musicMode() { // [mode, intensity 0-2]

    if (S.phase === 'count' || S.phase === 'wait') return ['play', 0];

  for (let k = 0; k < 3; k++) { ctx.fillStyle = k <= i ? (sel ? '#1a1206' : '#ffb347') : (sel ? 'rgba(26,18,6,0.25)' : 'rgba(255,255,255,0.22)'); ctx.beginPath(); const px = b.x + b.w - 70 + k * 17, py = y + 22; ctx.moveTo(px, py - 7); ctx.lineTo(px + 6, py); ctx.lineTo(px, py + 7); ctx.lineTo(px - 6, py); ctx.fill(); }
  ctx.font = `20px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = sel ? 'rgba(26,18,6,0.7)' : 'rgba(255,255,255,0.6)'; ctx.fillText(`0${i + 1}`, b.x + 28, y + 22);
  ctx.save(); ctx.translate(0, -12); drawBotIcon(b.x + b.w / 2, y + 56, d, sel); ctx.restore();
  ctx.textAlign = 'center'; ctx.font = `30px ${FONT}`; ctx.fillStyle = sel ? '#1a1206' : '#ffffff'; ctx.fillText(DIFF_NAME[d], b.x + b.w / 2, y + 112);
  ctx.font = `17px ${FONT}`; ctx.fillStyle = sel ? '#3a2410' : 'rgba(255,255,255,0.82)'; ctx.fillText(CARD_TEXT[d], b.x + b.w / 2, y + 136);
  ctx.restore();
}
function drawStartButton(t) {
  const b = startButton(), hov = titleHover === 3, pulse = 0.5 + 0.5 * Math.sin(t * 3.2), y = b.y - (hov ? 3 : 0);
  ctx.save(); ctx.shadowColor = `rgba(255,140,30,${0.5 + 0.4 * pulse})`; ctx.shadowBlur = 22 + 18 * pulse;
  slant(b.x, y, b.w, b.h, 24);
  const g = ctx.createLinearGradient(b.x, 0, b.x + b.w, 0); g.addColorStop(0, hov ? '#ffc760' : '#ffb13b'); g.addColorStop(1, '#ff6a1a'); ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = 3; ctx.strokeStyle = '#fff0c8'; ctx.stroke();
  ctx.font = `38px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1c1006'; ctx.fillText('게임 시작', b.x + b.w / 2 - 22, y + b.h / 2 + 1);
  rrect(b.x + b.w - 120, y + 17, 76, 32, 7); ctx.fillStyle = 'rgba(28,16,6,0.9)'; ctx.fill();
  ctx.font = `19px ${FONT}`; ctx.fillStyle = '#ffd9a0'; ctx.fillText('Enter', b.x + b.w - 82, y + b.h / 2 + 1);
  ctx.restore();
}
const KEY_CODES = { W: ['KeyW'], A: ['KeyA'], S: ['KeyS'], D: ['KeyD'], Shift: ['ShiftLeft', 'ShiftRight'], Space: ['Space'], P: ['KeyP'], M: ['KeyM'], '클릭': ['Mouse0'] };
const CONTROL_ITEMS = [[['W', 'A', 'S', 'D'], '이동'], [['Shift'], '달리기'], [['Space'], '점프'], [['클릭'], '발사'], [['P'], '일시정지'], [['M'], '소리']];
function keycap(x, y, w, h, label, on) { // a key seen from above and in front: a shadow, a body with a side wall, a top face that sinks when pressed
  const d = 8, ty = y + (on ? 6 : 0);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; rrect(x + 2, y + d + 5, w, h, 8); ctx.fill();
  rrect(x, y + d, w, h, 8); ctx.fillStyle = '#2b323c'; ctx.fill();
  ctx.fillStyle = '#48515f'; ctx.fillRect(x + 0.5, ty + h * 0.55, w - 1, y + d + h * 0.55 - (ty + h * 0.55));
  rrect(x, ty, w, h, 8);
  const g = ctx.createLinearGradient(0, ty, 0, ty + h); if (on) { g.addColorStop(0, '#ffd27a'); g.addColorStop(1, '#ff9a2a'); } else { g.addColorStop(0, '#fcfdff'); g.addColorStop(1, '#c3ccd8'); }
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = '#6f7a8b'; ctx.stroke();
  rrect(x + 2.5, ty + 2.5, w - 5, h - 5, 6); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1; ctx.stroke();
  rrect(x + 5, ty + 5, w - 10, h - 12, 5); ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fill();
  ctx.font = `17px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#151a22'; ctx.fillText(label, x + w / 2, ty + h / 2 + 1);
  ctx.restore();
}
function keysRow(y, items) { // a row of keycaps with a label after each group, centred on the window
  ctx.save(); ctx.font = `17px ${FONT}`; ctx.textBaseline = 'middle';
  const capW = k => Math.max(34, ctx.measureText(k).width + 22), lab = l => ctx.measureText(l).width;
  let total = 0; for (const [ks, lb] of items) total += ks.reduce((a, k) => a + capW(k) + 6, 0) + lab(lb) + 30;
  let x = W / 2 - total / 2 + 8;
  for (const [ks, lb] of items) {
    for (const k of ks) { const w = capW(k); keycap(x, y - 17, w, 32, k, (KEY_CODES[k] || []).some(c => down.has(c))); x += w + 6; }
    outText(lb, x + 6, y, 17, '#ffffff', 'left'); x += lab(lb) + 30;
  }
  ctx.restore();
}
function drawControls(y) { keysRow(y, CONTROL_ITEMS); }
function drawTitle() {
  const t = titleT, sh = titleShake;
  // the arena, turning slowly behind everything
  const a = t * 0.1 + 0.6;
  cam.position.set(Math.sin(a) * 23 + (fx() - 0.5) * sh * 0.6, 7 + Math.sin(t * 0.3) * 0.6 + (fx() - 0.5) * sh * 0.6, Math.cos(a) * 23);
  cam.lookAt(0, 1.2, 0); cam.fov = 58 + sh * 4; cam.updateProjectionMatrix();
  showVM(false); if (botMesh) botMesh.visible = true;
  if (renderer) renderer.render(world3d, cam);
  ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate((fx() - 0.5) * 16 * sh, (fx() - 0.5) * 16 * sh);
  // colour grade: dark corners, a cool top, a warm floor, fine scan lines
  let g = ctx.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.95); g.addColorStop(0, 'rgba(6,9,14,0.28)'); g.addColorStop(1, 'rgba(3,5,9,0.88)'); ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(30,60,110,0.22)'); g.addColorStop(0.55, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(120,50,10,0.2)'); ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = 'rgba(0,0,0,0.07)'; for (let y = 0; y < H; y += 4) ctx.fillRect(-20, y, W + 40, 1.4);
  // the dark of the intro lifts once the logo has landed
  const dark = t < SLAM ? 0.93 : 0.93 * (1 - easeOut((t - SLAM) / 0.8));
  if (dark > 0.001) { ctx.fillStyle = `rgba(3,4,7,${dark})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  drawBolts(t, t < SLAM ? 1 : 0.85);
  // the mark and the name
  const markY = 116, wordY = 244;
  if (t < SLAM) drawMark(W / 2, markY, 56, t, clamp((t - 0.05) / 0.72, 0, 1), 0);
  else { const pp = clamp((t - SLAM) / 0.4, 0, 1), s = 1 + 0.8 * Math.pow(1 - pp, 2); ctx.save(); ctx.translate(W / 2, markY); ctx.scale(s, s); ctx.translate(-W / 2, -markY); drawMark(W / 2, markY, 56, t, 1, easeOut(pp * 1.4)); ctx.restore(); }
  const rev = (t - SLAM) / 0.9;
  if (rev > 0) drawWordmark(W / 2, wordY, t, rev);
  if (t >= SLAM && t < SLAM + 0.22) { ctx.fillStyle = `rgba(255,236,200,${0.8 * (1 - (t - SLAM) / 0.22)})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  // the rest comes in after the logo
  const ui = easeOut((t - 1.45) / 0.45);
  if (ui > 0) {
    ctx.save(); ctx.globalAlpha = ui; ctx.translate(0, (1 - ui) * 26);
    ctx.font = `28px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd27a'; ctx.strokeStyle = 'rgba(8,10,14,0.9)'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeText('바운스 듀얼  ·  총알 3발, 벽에 튕기는 1대1 결투', W / 2, 316); ctx.fillText('바운스 듀얼  ·  총알 3발, 벽에 튕기는 1대1 결투', W / 2, 316);
    for (let i = 0; i < 3; i++) drawCard(i, t);
    drawStartButton(t);
    drawControls(676);
    slant(W - 250, 20, 226, 40, 12); ctx.fillStyle = 'rgba(14,18,26,0.85)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
    ctx.font = `20px ${FONT}`; ctx.fillStyle = '#ffffff'; ctx.fillText(`이번 맵 · ${MAPS[state.map].name}`, W - 137, 41);
    ctx.restore();
  }
  ctx.restore();
}

const HOME_AFTER = 9; // seconds on the end screen before the game goes home by itself
function goHome() { const S = state; S.afterT = 0; matchNo++; reset(true); titleT = 3; slamDone = true; titleStart = false; scene = 'title'; } // home = the title screen, its logo intro skipped
function endUpdate(dt) { // the end screen: Enter, a click or T go home; R fights again on a new map; it goes home by itself after HOME_AFTER seconds
  const S = state; stepWorld(dt); S.afterT = (S.afterT || 0) + dt;
  if (S.afterT > 0.5 && (pressed('Enter') || pressed('Mouse0') || pressed('KeyT') || pressed('Escape'))) { goHome(); return; }
  if (S.afterT > 0.5 && pressed('KeyR')) { S.afterT = 0; nextMatch(); return; }
  if (S.afterT > HOME_AFTER) goHome();
}
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      ensureFigures(); mapGroup.visible = false; fxGroup.visible = false; figGroup.visible = true; showVM(false);
      world3d.background = new THREE.Color(0x8fa0b0); world3d.fog = null;
      cam.position.set(1.4, 1.5, 2.2); cam.rotation.set(-0.04, 0, 0); cam.fov = 52; cam.updateProjectionMatrix();
      if (renderer) renderer.render(world3d, cam);
      ctx.clearRect(0, 0, W, H);
      const labels = [['쉬움 봇 (모자)', -3.8], ['보통 봇 (헬멧+조끼)', -1.0], ['어려움 봇 (큰 헬멧+가방)', 1.8], ['플레이어의 총', 5.6]];
      labels.forEach(([t, x]) => { const v = new THREE.Vector3(x, 2.1, -6).project(cam); outText(t, (v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H - 10, 20, '#ffffff'); });
      outText('바운스 듀얼 · 등장 인물', W / 2, 40, 30, '#ffffff');
      mapGroup.visible = true; fxGroup.visible = true; figGroup.visible = false; world3d.background = null; world3d.fog = new THREE.Fog(MAPS[state.map].fog, 45, 150);
    },
  },
  title: {
    update(dt) {
      titleT += dt; titleShake = Math.max(0, titleShake - dt * 2.4);
      if (!slamDone && titleT >= SLAM) { slamDone = true; if (titleT < SLAM + 0.25) { sfxSlam(); titleShake = 1; } }
      let hv = -1;
      for (let i = 0; i < 3; i++) if (inRect(mouse.x, mouse.y, diffCard(i))) hv = i;
      if (inRect(mouse.x, mouse.y, startButton())) hv = 3;
      if (hv !== titleHover) { titleHover = hv; if (hv >= 0) sfxTick(); }
      const i = DIFFS.indexOf(state.diff);
      if (pressed('ArrowLeft') || pressed('KeyA')) { state.diff = DIFFS[Math.max(0, i - 1)]; sfxTick(); }
      if (pressed('ArrowRight') || pressed('KeyD')) { state.diff = DIFFS[Math.min(2, i + 1)]; sfxTick(); }
      if (pressed('Digit1')) state.diff = 'easy'; if (pressed('Digit2')) state.diff = 'normal'; if (pressed('Digit3')) state.diff = 'hard';
      if (pressed('Enter') || pressed('Space') || titleStart) { titleStart = false; startMatch(); }
    },
    draw() { drawTitle(); },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; unlockMouse(); return; }
      stepWorld(dt);
    },
    draw() { frameDraw(true); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) { scene = 'play'; lockMouse(); } },
    draw() { frameDraw(true); ctx.fillStyle = 'rgba(8,10,14,0.6)'; ctx.fillRect(0, 0, W, H); outText('일시정지', W / 2, H / 2 - 20, 64, '#ffffff'); outText('클릭하거나 P를 누르면 계속', W / 2, H / 2 + 44, 28, '#ffd27a'); },
  },
  over: {
    update(dt) { endUpdate(dt); },
    draw() { endScreen('over'); },
  },
  results: {
    update(dt) { endUpdate(dt); },
    draw() { endScreen('win'); },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
if (params.get('intro') === '0') { titleT = 3; slamDone = true; } // ?intro=0 skips the logo's landing (screenshots)
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
